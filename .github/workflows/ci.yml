name: DevOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        working-directory: apps/status-dashboard
        run: docker compose config

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/status-dashboard
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/devops-dashboard:${{ github.sha }}

  deploy:

    needs: build-and-push

    if: github.event_name == 'push'

    runs-on: self-hosted

    steps:

      - name: Deploy to lab2
        run: |
          ssh deployer@192.168.56.12 '
           cd /opt/devops/apps/status-dashboard &&
           docker compose pull &&
           docker compose up -d --force-recreate
          '

      - name: Health Check
        run: |
          ssh deployer@192.168.56.12 '
           curl --fail http://localhost:8080
          '
